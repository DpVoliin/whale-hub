# Android 采集器构建（此前完全没有 CI）
name: android

on:
  push:
    paths: ["collector/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["collector/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ★ 为什么必须显式钉 Gradle 版本：
      #   ubuntu runner 自带的是 Gradle 9.x，而当年 AGP 8.9.2 只支持 Gradle 8.x →
      #   用系统 gradle 会直接构建失败（本工作流曾 12/12 全挂，就是这个原因）。
      #   现在已升到 AGP 9.4.1，对应的就是 Gradle 9.x：**两边必须一起动**，
      #   单改一边就是"AGP 9 要 Gradle 9 / 或 AGP 8 不认 Gradle 9"的必红组合。
      - name: 钉 Gradle 9.7.1（AGP 9.4.1 对应的版本）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: 缓存 Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('collector/**/*.gradle*', 'collector/gradle/*.toml') }}

      - name: 构建（没有发布密钥 → release 走未签名，不会失败）
        working-directory: collector
        run: |
          set -o pipefail                     # ★ 不加这个，`| tee` 会把 gradle 的失败码吃掉
          echo "--- 工具链（排障用：失败时一眼看出是哪一版）---"
          java -version
          gradle --version | head -6
          echo "--- 开始构建 ---"
          # --stacktrace：失败时日志里就有可读的根因，不用再猜
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease 2>&1 | tee /tmp/build.log

      # ★ 为什么要有这一步：Actions 的**原始日志**要仓库权限才读得到，
      #   但 check-run 的 **annotation 是公开可读的**。外部贡献者（和我）拿不到日志时，
      #   靠这条注解就能看到真正的报错，不用让人贴截图。
      - name: 失败时把 Gradle 报错摘成注解
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            echo "::error::$(grep -iE 'error|failed|what went wrong|Caused by|requires|Minimum supported|Unsupported|not compatible' /tmp/build.log | tail -12 | tr '\n' '~' | head -c 3500)"
          fi

      - name: 校验产物存在
        working-directory: collector
        run: |
          ls -la app/build/outputs/apk/debug/*.apk
          ls -la app/build/outputs/apk/release/*.apk || echo "::warning::release 产物缺失"

      - name: 上传 APK（仅 PR 便于人工验收）
        uses: actions/upload-artifact@v7
        with:
          name: whale-collector-debug-apk
          path: collector/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
