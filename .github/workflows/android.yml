# Android 采集器构建（此前完全没有 CI）
name: android

on:
  push:
    paths: ["collector/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["collector/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('collector/**/*.gradle*', 'collector/gradle/wrapper/gradle-wrapper.properties') }}

      - name: 构建（没有发布密钥 → release 走未签名，不会失败）
        working-directory: collector
        run: |
          # 显式锁 JDK 17：不同机器的默认 JDK 会导致产物不一致
          if [ -x ./gradlew ]; then ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
          else gradle --no-daemon :app:assembleDebug :app:assembleRelease; fi

      - name: 校验产物存在
        working-directory: collector
        run: |
          ls -la app/build/outputs/apk/debug/*.apk
          ls -la app/build/outputs/apk/release/*.apk || echo "::warning::release 产物缺失"

      - name: 上传 APK（仅 PR 便于人工验收）
        uses: actions/upload-artifact@v4
        with:
          name: whale-collector-debug-apk
          path: collector/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
