# Android 采集器构建（此前完全没有 CI）
name: android

on:
  push:
    paths: ["collector/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["collector/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ★ 为什么必须显式钉 Gradle 版本：
      #   ubuntu runner 自带的是 Gradle 9.x，而 AGP 8.9.2 只支持 Gradle 8.x →
      #   用系统 gradle 会直接构建失败（本工作流此前 12/12 全挂，就是这个原因）。
      #   钉住版本同时也让产物可复现（不同时间的 runner 不再影响构建）。
      - name: 钉 Gradle 8.13（AGP 8.9.2 支持的版本）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: 缓存 Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('collector/**/*.gradle*', 'collector/gradle/*.toml') }}

      - name: 构建（没有发布密钥 → release 走未签名，不会失败）
        working-directory: collector
        run: |
          echo "--- 工具链（排障用：失败时一眼看出是哪一版）---"
          java -version
          gradle --version | head -6
          echo "--- 开始构建 ---"
          # --stacktrace：失败时日志里就有可读的根因，不用再猜
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: 校验产物存在
        working-directory: collector
        run: |
          ls -la app/build/outputs/apk/debug/*.apk
          ls -la app/build/outputs/apk/release/*.apk || echo "::warning::release 产物缺失"

      - name: 上传 APK（仅 PR 便于人工验收）
        uses: actions/upload-artifact@v7
        with:
          name: whale-collector-debug-apk
          path: collector/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
