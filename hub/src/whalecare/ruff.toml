# 片段专用 lint 配置。
#
# 为什么需要它：`hub/src/whalecare/*.py` 是**片段**，不是能独立导入的模块 ——
# 它们之间靠全局变量通信（97_http 用 10_core 的 db()、用 60_analysis 的 _robust()…）。
# 直接单文件 lint 必然刷出几百个 F821「未定义名」**假阳性**（实测 662 处），
# 新人一敲就会误判"这项目代码质量很差"，或者干脆把 lint 关掉 —— 两者都亏。
#
# 两个门禁的分工（**有意的，别合并**）：
#   · 产物 `hub/hub.py`   → 完整模块，走根 pyproject 的**严格** lint，CI 强制
#   · 片段 `hub/src/...`  → 走本配置（关掉跨片段假阳性），保留其余真错误
#
# 用法：ruff check hub/src/whalecare/
extend = "../../../pyproject.toml"

[lint]
extend-ignore = [
    "F821",  # 未定义名：片段的正常形态（跨片段全局引用），单文件必然报
    "F401",  # 未用 import：同一个 import 常被别的片段用到，合并后才看得出在用
    "F811",  # 重复定义：同名小工具在不同片段各有一份
]
