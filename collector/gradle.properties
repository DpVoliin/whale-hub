org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# ★ 这三行删掉了（AGP 9 已把它们列为 unsupported project option，插件直接拒绝加载）：
#     android.useAndroidX=true              → AGP 9 起 AndroidX 是默认且必须
#     android.nonTransitiveRClass=true      → AGP 8 起就是默认值
#     android.defaults.buildfeatures.buildconfig=false → 整个 android.defaults.* 家族在 AGP 9 被移除
#   （buildConfig 在 AGP 9 默认就是关的，要开用 buildFeatures.buildConfig = true）
